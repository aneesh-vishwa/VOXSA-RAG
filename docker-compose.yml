version: '3.8'

services:
  voxsa-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voxsa-rag-app
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
      - app-data:/app/data
    restart: on-failure

volumes:
  app-data:
