version: '3.8'

services:
  voxsa-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
    
    container_name: voxsa-rag-app
    
    image: voxsa-rag:latest
    
    ports:
      - "8501:8501"  # Streamlit default port
    
    # Load environment variables from .env file
    env_file:
      - .env
    
    # Override or add specific environment variables
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      # Pass API keys from .env file
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
    
    # Volume mounts for persistence and development
    volumes:
      # Application data persistence
      - app-data:/app/data
      # ChromaDB persistence
      - chroma-db:/app/chroma_db
      # Output audio files
      - app-output:/app/output
      # Source code (for development - comment out for production)
      # - .:/app
    
    # Restart policy
    restart: unless-stopped
    
    # Resource limits (adjust based on your needs)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    
    # Network configuration
    networks:
      - voxsa-network
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Named volumes for persistent storage
volumes:
  app-data:
    driver: local
  chroma-db:
    driver: local
  app-output:
    driver: local

# Named network for container communication
networks:
  voxsa-network:
    driver: bridge
